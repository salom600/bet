name: Build VideoEditor

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required for release uploads

jobs:
  # ------------------------------------------------------------------- Linux
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools libqt6svg6-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
            libxi-dev libxrender-dev libxcb1-dev libxcb-glx0-dev \
            libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-util-dev libxcb-cursor0 \
            libglib2.0-dev libpulse-dev

      - name: Configure (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Stage Linux bundle
        run: |
          mkdir -p staging/VideoEditor-linux
          cp build/bin/VideoEditor staging/VideoEditor-linux/
          # Bundle Qt plugins + required libs via linuxdeploy-style manual copy
          # Simpler: ship with system-installed Qt expectation. We bundle qss.
          cp -r resources staging/VideoEditor-linux/
          # Create launcher script
          cat > staging/VideoEditor-linux/run.sh <<'EOF'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export QT_QPA_PLATFORM_PLUGIN_PATH="${HERE}"
          exec "${HERE}/VideoEditor" "$@"
          EOF
          chmod +x staging/VideoEditor-linux/run.sh
          tar czf VideoEditor-linux.tar.gz -C staging VideoEditor-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-linux-x64
          path: staging/VideoEditor-linux/
          if-no-files-found: error
          retention-days: 30

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoEditor-linux.tar.gz

  # ----------------------------------------------------------------- Windows
  build-windows:
    name: Build on Windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt6 via aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Latest aqtinstall (3.2+) fixes the "bin/assistant.exe" path bug
          # seen with Qt 6.7+ on Windows.
          pip install --upgrade aqtinstall
          $qtDir = "$PWD\Qt"
          New-Item -ItemType Directory -Force -Path $qtDir | Out-Null
          # Install Qt 6.8.1 (LTS) for MSVC 2022 x64
          $qtVersion = "6.8.1"
          Write-Host "Installing Qt $qtVersion ..."
          python -m aqt install-qt windows desktop $qtVersion win64_msvc2022_64 --outputdir $qtDir
          # Set Qt6_DIR for subsequent steps
          $installedRoot = Get-ChildItem -Directory $qtDir | Where-Object { $_.Name -like "6.*" } | Select-Object -First 1
          $msvcDir = Get-ChildItem -Directory $installedRoot.FullName | Select-Object -First 1
          echo "Qt6_DIR=$($msvcDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "PATH=$($msvcDir.FullName)\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Qt6_DIR set to: $($msvcDir.FullName)"
          Get-ChildItem $msvcDir.FullName | Select-Object Name | Format-Table -AutoSize

      - name: Download FFmpeg shared build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -MaximumRedirection 10
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $inner = Get-ChildItem -Directory ffmpeg_tmp | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path third_party/ffmpeg | Out-Null
          Copy-Item -Path "$($inner.FullName)\include" -Destination third_party/ffmpeg/include -Recurse -Force
          Copy-Item -Path "$($inner.FullName)\lib"     -Destination third_party/ffmpeg/lib     -Recurse -Force
          Copy-Item -Path "$($inner.FullName)\bin"     -Destination third_party/ffmpeg/bin     -Recurse -Force
          Write-Host "FFmpeg staged under third_party/ffmpeg"
          Get-ChildItem third_party/ffmpeg -Recurse | Select-Object FullName | Format-Table -AutoSize

      - name: Configure (CMake)
        shell: pwsh
        env:
          CMAKE_PREFIX_PATH: ${{ env.Qt6_DIR }}
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DFFMPEG_ROOT="$PWD/third_party/ffmpeg"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release -j

      - name: Stage Windows bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "staging\VideoEditor-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path build\bin\VideoEditor.exe -Destination $stage -Force
          # Copy FFmpeg DLLs
          Copy-Item -Path third_party\ffmpeg\bin\*.dll -Destination $stage -Force
          # Copy Qt6 plugins needed at runtime
          $qtBin = "$env:Qt6_DIR\bin"
          $plugins = "$env:Qt6_DIR\plugins"
          foreach ($dll in @("Qt6Core.dll","Qt6Gui.dll","Qt6Widgets.dll","Qt6Network.dll","Qt6Xml.dll","Qt6Concurrent.dll")) {
            $src = Join-Path $qtBin $dll
            if (Test-Path $src) { Copy-Item $src -Destination $stage -Force }
          }
          # Copy MSVC runtime DLLs (REQUIRED — without these, the app crashes
          # instantly on machines that don't have the Visual C++ Redistributable
          # installed). Use the official redist layout if available.
          $redistDir = $null
          if ($env:VCToolsRedistDir) {
            $crt = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
            if (Test-Path $crt) { $redistDir = $crt }
          }
          if (-not $redistDir -and $env:VCToolsInstallDir) {
            $cand = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64"
            if (Test-Path $cand) { $redistDir = $cand }
          }
          if ($redistDir) {
            Write-Host "Copying MSVC runtime from: $redistDir"
            foreach ($dll in @("MSVCP140.dll","MSVCP140_1.dll","MSVCP140_2.dll","VCRUNTIME140.dll","VCRUNTIME140_1.dll","CONCRT140.dll")) {
              $src = Join-Path $redistDir $dll
              if (Test-Path $src) {
                Copy-Item $src -Destination $stage -Force
                Write-Host "  Copied $dll"
              }
            }
          } else {
            Write-Warning "MSVC toolchain not found — runtime DLLs not bundled. App will crash on machines without VC++ Redist."
          }
          # Qt platform plugin (REQUIRED — without qwindows.dll, app crashes
          # instantly with no visible window)
          New-Item -ItemType Directory -Force -Path "$stage\platforms" | Out-Null
          Copy-Item "$plugins\platforms\qwindows.dll"  "$stage\platforms\" -Force
          # Qt style plugin
          New-Item -ItemType Directory -Force -Path "$stage\styles" | Out-Null
          Copy-Item "$plugins\styles\qwindowsvistastyle.dll" "$stage\styles\" -Force -ErrorAction SilentlyContinue
          # Copy all image format plugins (PNG, JPEG, etc.)
          New-Item -ItemType Directory -Force -Path "$stage\imageformats" | Out-Null
          if (Test-Path "$plugins\imageformats") {
            # Copy only release variants (skip *d.dll debug variants to halve size)
            Get-ChildItem "$plugins\imageformats\*.dll" | Where-Object { $_.Name -notmatch 'd\.dll$' } | ForEach-Object {
              Copy-Item $_.FullName "$stage\imageformats\" -Force
            }
          }
          # Resources
          Copy-Item -Path resources -Destination $stage -Recurse -Force
          # Write qt.conf so Qt finds plugins reliably regardless of working directory
          $qtConf = "[Paths]`r`nPlugins = .`r`nPrefix = .`r`n"
          Set-Content -Path "$stage\qt.conf" -Value $qtConf -Encoding ascii -NoNewline
          # Write a README.txt next to the .exe explaining how to run it
          $readme = @"
          VideoEditor v0.2.0
          ==================

          HOW TO RUN
          ----------
          Double-click VideoEditor.exe in THIS folder.

          IMPORTANT: Do NOT move VideoEditor.exe out of this folder.
          The .exe needs the DLLs (Qt6*.dll, av*.dll, MSVCP140.dll, etc.)
          and the platforms/ subfolder to be in the same directory.

          If the app crashes on launch:
            1. Install the Microsoft Visual C++ Redistributable 2015-2022 (x64)
               from https://aka.ms/vs/17/release/vc_redist.x64.exe
            2. Make sure platforms\qwindows.dll exists next to VideoEditor.exe

          TROUBLESHOOTING
          ---------------
          If you see "Entry point not found" errors, you have an outdated
          MSVC runtime — install the latest VC++ Redistributable above.
          "@
          # Trim leading whitespace per line (caused by YAML indentation)
          $readme = ($readme -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          Set-Content -Path "$stage\README-FIRST.txt" -Value $readme -Encoding utf8

          # Zip
          Compress-Archive -Path "$stage\*" -DestinationPath VideoEditor-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-windows-x64
          path: staging/VideoEditor-windows/
          if-no-files-found: error
          retention-days: 30

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoEditor-windows.zip
